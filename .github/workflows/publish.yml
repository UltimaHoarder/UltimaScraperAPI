name: Publish to PyPI

# Builds ultima-scraper-api for each release tag and publishes it to PyPI.
#
#   tag vX.Y.Z (matching pyproject.toml)  ->  ultima-scraper-api X.Y.Z
#
# PyPI accepts the upload through trusted publishing: the project trusts this
# workflow and its "pypi" environment, so no token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build the package
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2; exit 1; }
          uv build --no-sources --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ultima-scraper-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
